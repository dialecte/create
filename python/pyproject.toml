[project]
name = "dialecte-generate"
version = "0.4.0"
description = "XSD to TypeScript definition generator for Dialecte"
requires-python = ">=3.12"
dependencies = ["xmlschema>=4.3.1"]

[project.optional-dependencies]
dev = ["pytest>=9.0.2", "pytest-xdist>=3.8.0", "lxml>=6.0"]

[project.scripts]
dialecte-generate = "generate.__main__:main"

[tool.setuptools.packages.find]
include = ["generate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
	"corpora: reads the fetched corpora; runs with PROOF_CORPORA=1 (npm run test:corpora), required by PROOF_REQUIRE=corpora",
]
